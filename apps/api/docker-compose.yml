name: gupta-api

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: gupta-api:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-gupta}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/gupta_traders?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - gupta

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-gupta}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: gupta_traders
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gupta

  # One-shot seed (optional): docker compose --profile seed run --rm seed
  seed:
    profiles: [seed]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /app
    command: ["pnpm", "--filter", "api", "seed"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-gupta}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/gupta_traders?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - gupta

volumes:
  mongo_data:

networks:
  gupta:
    driver: bridge
